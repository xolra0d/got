[package]
name = "got"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
futures = "0.3.34"
log = "0.4.34"
pretty_env_logger = "0.5.0"
sha1 = "0.10.6"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "bytes", "net", "socket2", "time", "sync", "io-util"] }
zerocopy = { version = "0.8.63", features = ["derive", "std", "simd", "alloc", "zerocopy-derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
